; Seeed SenseCAP MeshPager X2 (alpha) - ESP32-S3R8 + Wio-LR2021 + AG3335
; Pin map from the board schematic (rev V01) cross-checked against Seeed's
; Meshtastic port (meshtastic/firmware PR #11255). Headless for now: the
; display needs d-pad navigation in the UI before it is useful.
[MeshPager_X2]
extends = esp32_base
board = seeed_meshpager_x2
build_flags = ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/meshpager_x2
  -D SEEED_MESHPAGER_X2
  -D PIN_BOARD_SDA=17 ; I2C0: TCA6424 expander, YSN8900E RTC
  -D PIN_BOARD_SCL=18
  -D ENV_PIN_SDA=47   ; I2C1: sensors, audio codecs
  -D ENV_PIN_SCL=48
  -D PIN_USER_BTN=9   ; power button, active high
  -D USER_BTN_PRESSED=HIGH
  -D PIN_VBAT_READ=1
  -D ADC_MULTIPLIER=2.09f ; 2:1 divider + 4.5% correction (Meshtastic port)
  -D PIN_TFT_BL=46
  -D USE_LR2021
  -D RADIO_CLASS=CustomLR2021
  -D WRAPPER_CLASS=CustomLR2021Wrapper
  -D LORA_TX_POWER=22
  -D P_LORA_SCLK=3
  -D P_LORA_MOSI=4
  -D P_LORA_MISO=5
  -D P_LORA_NSS=6
  -D P_LORA_DIO_1=7     ; LR2021 DIO8
  -D P_LORA_BUSY=8
  -D LR2021_IRQ_DIO=8
  -D LR2021_TCXO_VOLTAGE=3.0f ; X2 module runs its TCXO at 3.0 V (X1 is 1.6 V)
  -D ENV_INCLUDE_GPS=1
  -D PIN_GPS_TX=44      ; AG3335 TX -> ESP32 RX
  -D PIN_GPS_RX=43      ; AG3335 RX <- ESP32 TX
  -D GPS_BAUD_RATE=115200
  -D ENV_SKIP_GPS_DETECT=1 ; GNSS is always fitted, powered via the expander
  ; I2C1 also carries ES8311 0x18, ES7243E 0x14, LSM6DSO 0x6A, BMM350 0x15,
  ; SPA06 0x77; keep probes to what the board may actually carry
  -D ENV_INCLUDE_AHTX0=0
  -D ENV_INCLUDE_BME280=0
  -D ENV_INCLUDE_BMP280=0
  -D ENV_INCLUDE_SHTC3=0
  -D ENV_INCLUDE_SHT4X=1 ; listed by Meshtastic, not on the V01 schematic
  -D ENV_INCLUDE_INA3221=0
  -D ENV_INCLUDE_INA219=0
  -D ENV_INCLUDE_INA226=0
  -D ENV_INCLUDE_INA260=0
  -D ENV_INCLUDE_MLX90614=0
  -D ENV_INCLUDE_VL53L0X=0
  -D ENV_INCLUDE_BME680=0
  -D ENV_INCLUDE_BMP085=0
  -D ENV_INCLUDE_LPS22HB=0
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/meshpager_x2>
  +<helpers/sensors/*.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}

; -------- Companion: BLE phone app ------------------------------------------
[env:MeshPager_X2_companion_radio_ble]
extends = MeshPager_X2
build_flags =
  ${MeshPager_X2.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${MeshPager_X2.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${MeshPager_X2.lib_deps}
  densaugeo/base64 @ ~1.4.0

; -------- Companion: USB serial link ----------------------------------------
[env:MeshPager_X2_companion_radio_usb]
extends = MeshPager_X2
build_flags =
  ${MeshPager_X2.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_USB_INTERFACE
build_src_filter = ${MeshPager_X2.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${MeshPager_X2.lib_deps}
  densaugeo/base64 @ ~1.4.0

; -------- Standalone repeater -----------------------------------------------
[env:MeshPager_X2_repeater]
extends = MeshPager_X2
build_flags =
  ${MeshPager_X2.build_flags}
  -D ADVERT_NAME='"MeshPager X2 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${MeshPager_X2.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
lib_deps =
  ${MeshPager_X2.lib_deps}
  ${esp32_ota.lib_deps}
